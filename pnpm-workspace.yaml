packages:
  - apps/*
  - packages/*
  - tools/*

allowBuilds:
  esbuild: true
  workerd: true

# Exact pins for the pre-release lines are deliberate (docs/PLAN.md "Risks worth naming",
# ADR-0007, ADR-0008, ADR-0009). Upgrade them on purpose, all packages of a line together.
# `shadcn add` rewrites this file and strips comments; put them back when it does.
catalog:
  # Tiptap 3.31.x, pinned exactly and moved as a whole like oRPC: the editor is one
  # package family and a mismatch between them is a runtime error, not a type one.
  "@tiptap/core": 3.31.3
  "@tiptap/extension-code-block-lowlight": 3.31.3
  "@tiptap/extension-list": 3.31.3
  "@tiptap/extension-placeholder": 3.31.3
  "@tiptap/extension-table": 3.31.3
  "@tiptap/markdown": 3.31.3
  "@tiptap/pm": 3.31.3
  "@tiptap/react": 3.31.3
  "@tiptap/starter-kit": 3.31.3
  "@tiptap/suggestion": 3.31.3
  lowlight: ^3.3.0
  rehype-highlight: ^7.0.2
  "@fontsource-variable/ibm-plex-sans": 5.3.0
  "@fontsource/ibm-plex-mono": 5.3.0
  husky: ^9.1.7
  # The reference runtime's one runtime dependency, pinned exactly for the same
  # reason as the lines below: a 0.x moves, and what it moves is the options
  # object that decides what an agent with a shell may do (docs/plans/m4.md).
  "@anthropic-ai/claude-agent-sdk": 0.3.261
  "@types/node": ^26.1.1
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0
  better-auth: 1.7.2
  "@better-auth/drizzle-adapter": 1.7.2
  "@better-auth/api-key": 1.7.2
  "@better-auth/mcp": 1.7.2
  "@better-auth/cimd": 1.7.2
  "@modelcontextprotocol/server": 2.0.0
  auth: 1.7.2
  drizzle-orm: 1.0.0-rc.4
  drizzle-kit: 1.0.0-rc.4
  "@orpc/server": 2.0.0-beta.32
  "@orpc/client": 2.0.0-beta.32
  "@orpc/contract": 2.0.0-beta.32
  "@orpc/openapi": 2.0.0-beta.32
  "@orpc/zod": 2.0.0-beta.32
  "@orpc/json-schema": 2.0.0-beta.32
  "@orpc/tanstack-query": 2.0.0-beta.32
  "@orpc/shared": 2.0.0-beta.32
  hono: 4.13.5
  "@hono/node-server": 2.1.1
  zod: 4.5.4
  react: 19.2.8
  react-dom: 19.2.8
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4
  "@vitejs/plugin-react": ^6.1.0
  "@tanstack/react-query": 5.102.8
  "@tanstack/react-router": 1.170.32
  tailwindcss: 4.3.3
  "@tailwindcss/vite": 4.3.3
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^3.6.0
  tw-animate-css: ^1.4.0
  lucide-react: ^1.39.0
  "@base-ui/react": ^1.7.0
  react-markdown: ^10.1.0
  remark-gfm: ^4.0.1
  "@cloudflare/vite-plugin": 1.54.3
  "@cloudflare/workers-types": 5.20260903.1
  wrangler: 4.128.0
  sonner: ^2.0.8
  next-themes: ^0.4.6
  input-otp: ^1.5.0
  react-resizable-panels: ^4.12.3
  react-day-picker: ^10.0.1
  date-fns: ^4.4.0
  embla-carousel-react: ^8.6.0
  recharts: 3.8.0
  cmdk: ^1.1.1
  "@dnd-kit/core": ^6.3.1
  "@dnd-kit/utilities": ^3.2.2
  "@dnd-kit/sortable": ^10.0.0
  "@dnd-kit/modifiers": ^9.0.0

catalogMode: prefer

minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20260903.1"
  - "@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.261"
  - "@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.261"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.261"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.261"
  - "@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.261"
  - "@anthropic-ai/claude-agent-sdk-linux-x64@0.3.261"
  - "@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.261"
  - "@anthropic-ai/claude-agent-sdk-win32-x64@0.3.261"
  - "@anthropic-ai/claude-agent-sdk@0.3.261"

overrides:
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
