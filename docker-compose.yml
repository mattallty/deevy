# A single deevy instance with its data on a named volume. Copy .env.example to
# .env and fill it in, or set these in your own environment.
services:
  deevy:
    image: ghcr.io/mattallty/deevy:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - deevy-data:/data
    environment:
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set a secret of at least 32 characters}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?set the GitHub OAuth App client id}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?set the GitHub OAuth App client secret}
      DEEVY_ADMIN_EMAIL: ${DEEVY_ADMIN_EMAIL:?set the email that becomes the Workspace admin}
      DEEVY_WORKSPACE_NAME: ${DEEVY_WORKSPACE_NAME:-deevy}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # The reference agent runtime (docs/plans/m4.md). It is not part of deevy:
  # it holds one Agent's API key, which a Sponsor issues under Settings, Agents
  # after the instance is up, so this service is off until you ask for it:
  #
  #     docker compose --profile agent up -d
  #
  # Build it with `docker build -f apps/claude-agent/Dockerfile -t deevy-agent .`
  agent:
    profiles: ["agent"]
    image: deevy-agent
    restart: unless-stopped
    depends_on:
      deevy:
        condition: service_healthy
    environment:
      DEEVY_URL: ${DEEVY_AGENT_URL:-http://deevy:3000}
      DEEVY_AGENT_KEY: ${DEEVY_AGENT_KEY:?issue an API key for the Agent under Settings, Agents}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?the runtime runs Claude, and Claude needs a key}
      DEEVY_AGENT_POLL_SECONDS: ${DEEVY_AGENT_POLL_SECONDS:-30}
      DEEVY_AGENT_MODEL: ${DEEVY_AGENT_MODEL:-claude-opus-5}

volumes:
  deevy-data:
