name: Release

# Publishes two images and nothing else: deevy, and the reference agent runtime
# beside it. The Cloudflare Worker built from the same commit is deployed by hand
# (docs/OPERATIONS.md), because uploading one needs an account credential this
# repository does not hold.
#
# Two ways in, and the first is the normal one:
#
#  - `workflow_call`, from changesets.yml, once a Version PR has merged. It has to
#    be a call rather than the tag below, because a tag pushed with GITHUB_TOKEN
#    does not trigger a workflow — wiring the merge to push a tag and expecting
#    this file to notice produces a release that silently never happens.
#  - a `v*` tag pushed by hand, which stays as the escape hatch for a release
#    made outside the changesets flow (docs/OPERATIONS.md).
#
# CI's own checks run on main and on pull requests; `verify` re-runs them so
# neither route can publish something that does not build.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      version:
        description: The version being released, without a leading v.
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # The ref carries a version only on the tag-push route; on a call it
          # is main, so the caller passes the version instead. Exactly one of
          # these two pairs is enabled.
          tags: |
            type=semver,pattern={{version}},enable=${{ inputs.version == '' }}
            type=semver,pattern=v{{version}},enable=${{ inputs.version == '' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=v${{ inputs.version }},enable=${{ inputs.version != '' }}
            # A prerelease must never move `latest`. Both routes carry the
            # version in a different place, and a `-` in it is what marks one:
            # v0.5.0-rc.1 publishes under its own tags and leaves latest alone.
            type=raw,value=latest,enable=${{ !contains(inputs.version || github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The reference runtime is a separate deployment and a separate decision: an
  # instance with no runtime is a Workspace where the Humans do the work, and
  # docker-compose keeps it behind a profile so nobody starts one by accident
  # (ADR-0013, ADR-0014).
  publish-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-agent
          # The ref carries a version only on the tag-push route; on a call it
          # is main, so the caller passes the version instead. Exactly one of
          # these two pairs is enabled.
          tags: |
            type=semver,pattern={{version}},enable=${{ inputs.version == '' }}
            type=semver,pattern=v{{version}},enable=${{ inputs.version == '' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=v${{ inputs.version }},enable=${{ inputs.version != '' }}
            # A prerelease must never move `latest`. Both routes carry the
            # version in a different place, and a `-` in it is what marks one:
            # v0.5.0-rc.1 publishes under its own tags and leaves latest alone.
            type=raw,value=latest,enable=${{ !contains(inputs.version || github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/claude-agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
