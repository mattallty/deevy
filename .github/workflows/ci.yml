name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by release.yml, so a tag cannot publish something that does not build.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install
        run: vp install --frozen-lockfile

      - name: Format, lint, typecheck
        run: vp check

      - name: Test
        run: vp run -r test

      - name: Build (Node server and SPA)
        run: vp run -r build

      - name: Build (Cloudflare Worker)
        run: vp run web#build:workers

      - name: Validate the Worker bundle
        run: vp run web#check:workers

      # The deployed shape, on workerd: bindings and asset routing included,
      # which no test of createApp can see. `--local` needs no account.
      - name: The Worker serves deevy
        run: vp run web#test:workers

      # M4's acceptance walk, which needs no account and no OAuth App: deevy on
      # both deployments, a GitHub stub, a bare git repository and a stub of
      # GitHub's pull-request API, with the real supervisor driving
      # (docs/m4-acceptance.md).
      - name: The reference runtime works an Issue end to end, on both deployments
        run: vp run claude-agent#acceptance

      - name: Migration SQL guard
        run: vp run db#check:migrations

      # drizzle generates and wrangler applies (ADR-0008), so the projection is
      # only proven by wrangler applying it: an empty local D1, no account.
      - name: Migrations build the schema on D1
        run: vp run db#check:d1

      - name: OpenAPI snapshot is current
        run: |
          vp run core#snapshot:openapi
          git diff --exit-code -- packages/core/openapi.json

      # The tool set an agent sees, diffed like the HTTP surface (ADR-0009).
      - name: MCP tool list is current
        run: |
          vp run core#snapshot:mcp-tools
          git diff --exit-code -- packages/core/mcp-tools.json

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - name: Build the Docker image
        run: docker build -f apps/server/Dockerfile -t deevy:ci .
      - name: Smoke the image
        run: |
          docker run -d --name deevy -p 3000:3000 \
            -e BETTER_AUTH_SECRET=ci-secret-ci-secret-ci-secret-ci-secret \
            -e BETTER_AUTH_URL=http://localhost:3000 \
            -e DEEVY_DATABASE_PATH=/data/deevy.sqlite deevy:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/healthz; then exit 0; fi
            sleep 1
          done
          docker logs deevy
          exit 1

  # The reference runtime is a second image and a separate deployment
  # (docs/plans/m4.md). The smoke proves the image builds, starts, reads its
  # configuration and reaches a real deevy over a real socket; every claim about
  # what it does with a Run is a test in apps/claude-agent, against a real deevy
  # and a scripted session.
  agent-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - name: Build the runtime image
        run: docker build -f apps/claude-agent/Dockerfile -t deevy-agent:ci .

      # BETTER_AUTH_URL stays loopback because Better Auth refuses a plain-http
      # MCP resource that is not. It is the OAuth issuer, and the runtime
      # authenticates with an API key, so the two are independent here.
      - name: Start deevy
        run: |
          docker network create deevy-ci
          docker build -f apps/server/Dockerfile -t deevy:ci .
          docker run -d --name deevy --network deevy-ci \
            -e BETTER_AUTH_SECRET=ci-secret-ci-secret-ci-secret-ci-secret \
            -e BETTER_AUTH_URL=http://localhost:3000 \
            -e DEEVY_DATABASE_PATH=/data/deevy.sqlite deevy:ci
          for i in $(seq 1 30); do
            if docker run --rm --network deevy-ci curlimages/curl:8.11.1 \
              -fsS http://deevy:3000/healthz; then exit 0; fi
            sleep 1
          done
          docker logs deevy
          exit 1

      # A key nobody issued is refused, and the runtime says so and stops rather
      # than polling an instance it cannot be a Member of.
      - name: The runtime reaches deevy and reports what it is told
        run: |
          set +e
          out=$(docker run --rm --network deevy-ci \
            -e DEEVY_URL=http://deevy:3000 \
            -e DEEVY_AGENT_KEY=not-a-key deevy-agent:ci node dist/main.mjs --once 2>&1)
          code=$?
          set -e
          echo "$out"
          test $code -ne 0
          echo "$out" | grep -qE "UNAUTHORIZED|FORBIDDEN"

      - name: Configuration it cannot start without is named
        run: |
          set +e
          out=$(docker run --rm deevy-agent:ci node dist/main.mjs --once 2>&1)
          code=$?
          set -e
          echo "$out"
          test $code -ne 0
          echo "$out" | grep -q DEEVY_URL
